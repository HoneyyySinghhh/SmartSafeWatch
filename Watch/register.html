```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account | SafePulse</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#071923,#104451,#087e8b);color:white}
.card{width:100%;max-width:450px;padding:32px;background:#0b2632;border:1px solid #28515d;border-radius:20px;box-shadow:0 20px 55px #0005}
.logo{text-align:center;font-size:29px;font-weight:bold;margin-bottom:10px}
.logo span{color:#35e0c1}
.subtitle{text-align:center;color:#b7cbd2;font-size:13px;line-height:1.7;margin-bottom:24px}
h2{text-align:center;margin-bottom:10px;font-size:24px}
label{display:block;font-size:14px;margin:14px 0 7px}
input{width:100%;padding:12px;border-radius:9px;border:1px solid #365761;background:#102f3b;color:white;outline:none}
input:focus{border-color:#35e0c1}
button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:9px;background:#35e0c1;color:#06232c;font-size:15px;font-weight:bold;cursor:pointer}
.message{padding:11px;margin-bottom:12px;border-radius:8px;background:#47252c;color:#ffc4c4;font-size:13px}
p.link{text-align:center;margin-top:20px;color:#b7cbd2;font-size:14px;line-height:1.8}
a{color:#35e0c1;text-decoration:none;font-weight:bold}
a:hover{text-decoration:underline}
.back{text-align:center;margin-top:18px;font-size:13px}
</style>
</head>
<body>
<div class="card">
    <div class="logo">Safe<span>Pulse</span></div>
    <p class="subtitle">Create your account to get started.</p>
    <h2>Create Account</h2>
    <p class="subtitle">Enter your details below.</p>

    {% if messages %}
        {% for message in messages %}
            <div class="message">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="POST" action="{% url 'register' %}">
        {% csrf_token %}

        <label for="username">Username</label>
        <input id="username" name="username" type="text" placeholder="Choose a username" autocomplete="username" required>

        <label for="email">Email Address</label>
        <input id="email" name="email" type="email" placeholder="Enter your email" autocomplete="email" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Create a password" minlength="8" autocomplete="new-password" required>

        <label for="confirm_password">Confirm Password</label>
        <input id="confirm_password" name="confirm_password" type="password" placeholder="Re-enter your password" minlength="8" autocomplete="new-password" required>

        <button type="submit">Create My Account</button>
    </form>

    <p class="link">
        Already have an account?<br>
        <a href="{% url 'login' %}">Login here</a>
    </p>

    <div class="back">
        <a href="{% url 'welcome' %}">&larr; Back to Welcome Page</a>
    </div>
</div>

<script>
document.querySelector("form").addEventListener("submit", function(event) {
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirm_password").value;

    if (password !== confirmPassword) {
        event.preventDefault();
        alert("Passwords do not match. Please try again.");
    }
});
</script>
</body>
</html>
